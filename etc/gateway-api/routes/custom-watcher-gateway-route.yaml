---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: custom-watcher-gateway-route
  namespace: openstack
  labels:
    application: gateway-api
    service: HTTPRoute
    route: watcher
spec:
  parentRefs:
    - name: flex-gateway
      sectionName: watcher-https
      namespace: envoy-gateway
  hostnames:
    - "watcher.your.domain.tld"
  rules:
    - backendRefs:
        - name: watcher-api
          port: 9322
